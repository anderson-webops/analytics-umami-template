name: Create docker images (cloud)

on:
  push:
    branches:
      - analytics
      - cloud

concurrency:
  group: analytics-cloud-container-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate cloud source
    if: github.repository == 'umami-software/umami'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP_SECRET: cloud-validation-only-secret-000000000000000000
      DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
      DISABLE_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_DB_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and validate cloud source
        run: |
          pnpm run audit:all
          pnpm run audit:prod
          pnpm run validate
          pnpm run build-docker

  build:
    name: Build, push, and deploy
    if: github.repository == 'umami-software/umami'
    needs: validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute immutable cloud tag
        id: image
        run: echo "tag=cloud-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: umamisoftware/umami:${{ steps.image.outputs.tag }},umamisoftware/umami:cloud-latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true
