name: Validate direct production release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate non-container release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_SECRET: release-validation-only-secret-0000000000000000
      DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
      DISABLE_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_DB_CHECK: "1"

    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and validate source
        run: |
          pnpm run audit:all
          pnpm run audit:prod
          pnpm run validate

      - name: Build direct production runtime
        run: pnpm run build:production

      - name: Verify standalone runtime identity
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/public/script.js
          test -d .next/standalone/.next/static
          test ! -e Dockerfile
          test ! -e docker-compose.yml
