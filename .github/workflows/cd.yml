name: Validate direct production release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate non-container release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      APP_SECRET: release-validation-only-secret-0000000000000000
      DATABASE_URL: postgresql://umami:release-validation-password-000000000000@127.0.0.1:5432/umami?schema=public
      RUNTIME_ACCEPTANCE_DATABASE_URL: postgresql://umami:release-validation-password-000000000000@127.0.0.1:5432/umami?schema=public
      DISABLE_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated PostgreSQL acceptance fixture
        env:
          PGPASSWORD: release-validation-password-000000000000
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE USER umami WITH PASSWORD 'release-validation-password-000000000000';"
          sudo -u postgres createdb --owner umami umami
          pnpm build:db
          pnpm db:migrate
          UMAMI_USERNAME=admin UMAMI_PASSWORD=release-validation-admin-000000000000 pnpm change-password

      - name: Audit and validate source
        run: |
          pnpm run audit:all
          pnpm run audit:prod
          pnpm run validate

      - name: Build direct production runtime
        env:
          PUBLIC_URL: https://analytics.example.com
          CLIENT_IP_HEADER: x-real-ip
          UMAMI_BIND_ADDRESS: 127.0.0.1
        run: pnpm run build:production

      - name: Verify exact Linux ARM64 runtime and migration state
        env:
          PUBLIC_URL: https://analytics.example.com
          CLIENT_IP_HEADER: x-real-ip
          UMAMI_BIND_ADDRESS: 127.0.0.1
        run: |
          NODE_ENV=production pnpm check:env
          NODE_ENV=production pnpm check:db
          node scripts/runtime-artifact.mjs verify .next/standalone --release --expected-commit "$GITHUB_SHA"
          command -v bwrap >/dev/null || { sudo apt-get update && sudo apt-get install --yes bubblewrap; }
          node scripts/test-runtime-artifact.mjs --release --require-isolation --expected-commit "$GITHUB_SHA"
          test ! -e Dockerfile
          test ! -e docker-compose.yml
