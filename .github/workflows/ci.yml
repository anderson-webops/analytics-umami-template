name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SECRET: ci-validation-only-secret-00000000000000000000
  DISABLE_TELEMETRY: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
      SKIP_DB_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies
        run: pnpm run audit:all

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Validate source, peers, and native package coverage
        run: pnpm run validate

      - name: Build deploy artifact
        run: pnpm run build:production

  end-to-end:
    name: Authentication and role workflows
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.18-alpine3.24@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_DB: umami
          POSTGRES_USER: umami
          POSTGRES_PASSWORD: database-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umami -d umami"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_SECRET: test-${{ github.sha }}
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:database-${{ github.run_id }}@127.0.0.1:5432/umami
      UMAMI_PASSWORD: Test-admin-${{ github.run_id }}-A9!
      UMAMI_USER: admin
      UMAMI_USER_ID: 41e2b680-648e-4b09-bcd7-3e2b10c06264

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated database
        run: |
          pnpm run build-db
          pnpm run update-db
          pnpm run change-password
          pnpm run check-env
          pnpm run check-db

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise authentication and role workflows
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
