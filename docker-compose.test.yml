x-umami-service: &umami-service
  image: ${UMAMI_TEST_IMAGE:-umami-test:local}
  build:
    context: .
    dockerfile: tests/api/docker/Dockerfile
  ports:
    - "127.0.0.1:${UMAMI_TEST_PORT:-3100}:3000"
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/heartbeat').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 2s
    timeout: 5s
    retries: 90
    start_period: 20s

x-umami-env: &umami-env
  DATABASE_URL: postgresql://umami:umami@db:5432/umami
  APP_SECRET: umami-disposable-api-test-secret-00000000000000
  UMAMI_TEST_LOCAL_COMPOSE: "1"
  KAFKA_HISTORY_ATTESTED_CLEAN: "true"
  CLICKHOUSE_HISTORY_ATTESTED_CLEAN: "true"
  TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow -- deterministic test-only key
  # Playwright/curl user agents are classified as bots; without this /api/send silently drops events.
  DISABLE_BOT_CHECK: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_UPDATES: "1"
  MCP_ENABLED: "1"
  COLLECTION_SERVER_KEYS_JSON: ${UMAMI_TEST_COLLECTION_SERVER_KEYS_JSON:?Use scripts/test-api.ts to supply disposable test keys}

services:
  db:
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 2s
      timeout: 5s
      retries: 30

  umami:
    <<: *umami-service
    profiles: [postgres]
    environment: *umami-env
    depends_on:
      db:
        condition: service_healthy

  clickhouse:
    # Pinned to an LTS release. 26.7+ rejects db/clickhouse/schema.sql because
    # website_event_stats_hourly has dimension columns outside the sorting key
    # (see allow_dimensions_outside_sorting_key).
    image: clickhouse/clickhouse-server:25.8
    profiles: [clickhouse]
    environment:
      CLICKHOUSE_DB: umami
      CLICKHOUSE_USER: umami
      CLICKHOUSE_PASSWORD: umami
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    tmpfs:
      - /var/lib/clickhouse
    volumes:
      # The image runs /docker-entrypoint-initdb.d/*.sql on first start (empty data dir).
      - ./tests/api/docker/clickhouse-init/00-create-db.sql:/docker-entrypoint-initdb.d/00-create-db.sql:ro
      - ./db/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Healthy only once schema.sql has been applied (session_link is the last table it creates).
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --user umami --password umami --query "SELECT throwIf(count() = 0) FROM system.tables WHERE database = ''umami'' AND name = ''session_link''"',
        ]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  umami-clickhouse:
    <<: *umami-service
    profiles: [clickhouse]
    environment:
      <<: *umami-env
      CLICKHOUSE_URL: http://umami:umami@clickhouse:8123/umami
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
